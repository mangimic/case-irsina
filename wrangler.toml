# ── Cloudflare: Irsina · Case nel centro storico ──
#
# Deployt als Worker mit statischen Dateien (Workers Static Assets). Es gibt
# keinen Worker-Code — nur den Ordner dist/, den Astro baut; deshalb steht hier
# kein "main", sondern allein [assets].
#
# Im Dashboard beim Verbinden mit Git:
#
#   Build command:   npm run build && npm run build:pruefen
#   Deploy command:  npx wrangler deploy
#
# Der Build-Befehl enthaelt bewusst die Kontrolle: findet sie eine ungeschuetzte
# Telefonnummer, eine fehlende Seite oder einen fehlenden Pruefhinweis, schlaegt
# das Deployment fehl, statt etwas Falsches zu veroeffentlichen.
#
# Zusaetzlich unter Settings -> Variables and Secrets setzen:
#   SITE_URL = https://<adresse-der-seite>
# Ohne sie zeigen die Teilen-Knoepfe auf case-irsina.it, solange es die Domain
# noch nicht gibt.
#
# WICHTIG: "name" muss dem Namen des Workers im Dashboard entsprechen. Steht
# hier ein anderer, legt wrangler beim Deployen einen zweiten Worker an.

name = "irsina-immobili"
compatibility_date = "2026-08-01"

# Der Worker steht nur fuer /api/* bereit; alles andere liefert Cloudflare
# direkt aus dem Ordner unten. Ohne ihn gaebe es kein Kontaktformular und
# keinen Editor auf der Seite.
main = "worker/index.ts"

[assets]
# Was Astro gebaut hat. public/_headers und public/_redirects liegen danach in
# dist/ und werden von Cloudflare ausgewertet — die Sicherheits-Header und die
# Weiterleitungen gelten also weiterhin.
directory = "./dist"

# Astro legt eine eigene 404-Seite an; ohne diese Zeile kaeme Cloudflares.
not_found_handling = "404-page"

# Der Worker braucht Zugriff darauf, um unbekannte Wege an die Seite
# weiterzureichen.
binding = "ASSETS"

[vars]
# Wohin der Editor zurueckschreibt. Kein Geheimnis — der Token dazu schon,
# der steht als Secret GITHUB_TOKEN im Dashboard.
GITHUB_BESITZER = "mangimic"
GITHUB_REPO = "case-irsina"
GITHUB_ZWEIG = "main"

# Noch NICHT eingetragen, weil es die Datenbank erst geben muss:
#
#   npx wrangler d1 create irsina
#   npx wrangler d1 execute irsina --remote --file migrations/0001_nachrichten.sql
#
# Danach die ausgegebene database_id hier eintragen und neu bauen. Bis dahin
# sagt das Formular sauber, dass der Speicher fehlt, statt Nachrichten zu
# verlieren.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "irsina"
# database_id = "..."
